_schema-version: '3.2.0'
ID: sap-s4hana-abap-integration
version: 1.0.0
description: "SAP S/4HANA & ABAP Integration with SAP BTP & Web Backend"

modules:
  - name: s4-web-backend
    type: nodejs
    path: ../web-backend
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: s4-integration-xsuaa
      - name: s4-integration-destination
      - name: s4-integration-connectivity

resources:
  - name: s4-integration-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: s4-integration-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: s4-integration-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
